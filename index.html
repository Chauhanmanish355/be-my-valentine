<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my valentine?</title>
  <style>
    :root{
      --bg: #ffe6f0;
      --card: #fff6fb;
      --accent: #ff476f;
      --accent-dark: #e3003a;
      --muted: #6b2230;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 10% 10%, #fff0f5 0%, var(--bg) 35%), var(--bg);
      color:var(--muted);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,246,250,0.95));
      border-radius:18px;
      padding:36px 40px;
      text-align:center;
      box-shadow: 0 10px 40px rgba(227,0,58,0.08), 0 4px 10px rgba(0,0,0,0.05);
      max-width:720px;
      width:90%;
      transform: translateY(-10px);
      position: relative; /* make decoration absolute inside the card */
      overflow: visible;
    }

    /* ensure important content sits above decoration */
    .card > :not(.decoration){ position: relative; z-index: 2; }

    h1{
      margin:0 0 22px;
      font-size:clamp(20px, 3.8vw, 40px);
      line-height:1.05;
      letter-spacing:0.2px;
      color:var(--accent-dark);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    .subtext{
      margin:0 0 18px;
      color:#873248;
      opacity:0.95;
      font-size:1rem;
    }

    .buttons{
      display:flex;
      gap:16px;
      justify-content:center;
      align-items:center;
      margin-top:6px;
      position:relative; /* keep layout for yes button */
      height:56px; /* space for moving button */
      z-index:2;
    }

    .btn{
      padding:12px 22px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      font-weight:700;
      font-size:1rem;
      transition:transform .14s ease, box-shadow .14s ease;
      box-shadow: 0 6px 18px rgba(227,0,58,0.08);
      user-select:none;
    }

    .btn:active{ transform:scale(.98); }

    .yes{
      background: linear-gradient(180deg, #ff6fa3, var(--accent));
      color:white;
      text-shadow:0 1px 0 rgba(0,0,0,0.08);
    }

    .no{
      background: linear-gradient(180deg, #fff1f6, #ffd6e6);
      color:var(--accent-dark);
      border:2px solid rgba(227,0,58,0.08);
      position:relative; /* will be set to absolute when moving */
      min-width:120px;
      /* Smooth position transitions when we move it */
      transition: left .32s cubic-bezier(.2,.9,.2,1), top .32s cubic-bezier(.2,.9,.2,1), transform .12s ease;
      z-index:2;
    }

    /* celebration style for the final message */
    .celebrate{
      color:var(--accent-dark);
      text-shadow: 0 4px 18px rgba(255,71,111,0.18);
      transform:scale(1.02);
    }

    /* decoration placed inside the card so hearts can originate behind the message */
    .decoration{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:visible;
      z-index:1; /* behind the card content (which has z-index:2) */
    }

    .floating-heart{
      position:absolute;
      font-size:24px;
      will-change:transform,opacity;
      animation: floatUp linear forwards;
      opacity:0;
      transform-origin: center;
      z-index:1;
      text-shadow: 0 2px 10px rgba(255,71,111,0.12);
    }

    @keyframes floatUp{
      0%{ transform: translateY(0) scale(.9); opacity:0; }
      5%{ opacity:1; transform: translateY(-6px) scale(1); }
      100%{ transform: translateY(-160px) scale(1.2); opacity:0; }
    }

    /* simple responsive tweaks */
    @media (max-width:420px){
      .card{ padding:26px; border-radius:14px; }
      h1{ font-size:20px; }
      .buttons{ gap:12px; height:64px; }
      .btn{ padding:10px 14px; font-size:.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <h1 id="message">Shivani, will you be my valentine ? <span aria-hidden="true">💘</span></h1>
      <p class="subtext">A tiny question from someone who thinks you're special ✨</p>

      <div class="buttons" id="btnArea">
        <button id="yesBtn" class="btn yes" type="button">OMG, Yes</button>
        <button id="noBtn" class="btn no" type="button">Hell No</button>
      </div>

      <!-- decorative floating hearts will be appended here by JS (inside the card so they can appear behind the text) -->
      <div class="decoration" id="decoration" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    (function(){
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const message = document.getElementById('message');
      const card = document.getElementById('card');
      const decoration = document.getElementById('decoration');
      const btnArea = document.getElementById('btnArea');

      // Ensure the no button starts inline; we'll switch to absolute when moving.
      let moving = false;
      let movedToContainer = false;

      function clamp(v, min, max){ return Math.max(min, Math.min(v, max)); }

      function moveNoButton(){
        if (moving) return;
        moving = true;

        // measure current sizes and positions relative to the page
        const containerRect = document.querySelector('.container').getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();

        // compute current position relative to the container (so we can preserve the visual spot)
        const currentLeftRel = btnRect.left - containerRect.left;
        const currentTopRel  = btnRect.top - containerRect.top;

        // On first move, move the button node into the container so absolute coords are relative to full container
        if (!movedToContainer) {
          document.querySelector('.container').appendChild(noBtn);
          noBtn.style.position = 'absolute';
          noBtn.style.left = currentLeftRel + 'px';
          noBtn.style.top = currentTopRel + 'px';
          noBtn.style.zIndex = 999;
          movedToContainer = true;
        }

        // pick a random spot within the container, but keep minimum hop distance for "here-and-there" effect
        const contRect = document.querySelector('.container').getBoundingClientRect();
        const btnW = btnRect.width;
        const btnH = btnRect.height;
        const pad = 12;
        const maxLeft = Math.max(pad, contRect.width - btnW - pad);
        const maxTop  = Math.max(pad, contRect.height - btnH - pad);

        const minDistance = Math.max(160, Math.min(contRect.width, contRect.height) * 0.18);
        let targetLeft, targetTop, attempts = 0;
        const currentLeft = parseFloat(noBtn.style.left) || currentLeftRel;
        const currentTop  = parseFloat(noBtn.style.top)  || currentTopRel;

        do {
          targetLeft = Math.random() * (maxLeft - pad) + pad;
          targetTop  = Math.random() * (maxTop - pad) + pad;
          attempts++;
          if (attempts > 12) break;
        } while (Math.hypot(targetLeft - currentLeft, targetTop - currentTop) < minDistance);

        const finalLeft = clamp(targetLeft, pad, maxLeft);
        const finalTop  = clamp(targetTop, pad, maxTop);

        requestAnimationFrame(() => {
          noBtn.style.left = Math.round(finalLeft) + 'px';
          noBtn.style.top  = Math.round(finalTop)  + 'px';
          noBtn.style.transform = 'translateY(-6px) scale(1.02)';
          setTimeout(() => { noBtn.style.transform = ''; }, 260);
        });

        setTimeout(() => { moving = false; }, 520);
      }

      // Prevent the user from successfully clicking the "no" button:
      noBtn.addEventListener('mouseenter', moveNoButton);
      noBtn.addEventListener('click', (e) => {
        e.preventDefault();
        moveNoButton();
      });

      // If the user resizes the window, keep the no button inside bounds
      window.addEventListener('resize', () => {
        if (movedToContainer && noBtn.style.position === 'absolute') {
          const contRect = document.querySelector('.container').getBoundingClientRect();
          const btnRectNow = noBtn.getBoundingClientRect();
          const left = parseFloat(noBtn.style.left) || 0;
          const top = parseFloat(noBtn.style.top) || 0;
          const pad = 12;
          const maxLeft = Math.max(pad, contRect.width - btnRectNow.width - pad);
          const maxTop = Math.max(pad, contRect.height - btnRectNow.height - pad);
          noBtn.style.left = clamp(left, pad, maxLeft) + 'px';
          noBtn.style.top  = clamp(top,  pad, maxTop) + 'px';
        }
      });

      // Yes button click -> reveal final message and celebration
      yesBtn.addEventListener('click', () => {
        // update message to a romantic line with emoji
        message.innerHTML = 'Shivani — my heart is yours, today and always <span aria-hidden="true">❤️</span>';
        message.classList.add('celebrate');

        // hide the buttons container
        btnArea.style.display = 'none';
        // also ensure the no button (if moved elsewhere) is hidden
        if (noBtn && noBtn.style) { noBtn.style.display = 'none'; }
        // hide the yes button if it's still visible
        if (yesBtn && yesBtn.style) { yesBtn.style.display = 'none'; }

        // spawn floating hearts from behind the message
        spawnHearts(18);
      });

      // Create some animated floating hearts for celebration
      function spawnHearts(count){
        const emojis = ['💖','💘','😍','💕','🥰','💞','💓'];

        // compute card and message positions so hearts appear around the text
        const cardRect = card.getBoundingClientRect();
        const messageRect = message.getBoundingClientRect();

        for (let i=0; i<count; i++){
          const span = document.createElement('span');
          span.className = 'floating-heart';
          span.textContent = emojis[Math.floor(Math.random()*emojis.length)];

          // random x within the message width (with some spread)
          const spreadX = Math.max(12, messageRect.width * 0.6);
          const cx = (messageRect.left - cardRect.left) + (messageRect.width/2) + (Math.random() * spreadX - spreadX/2);

          // random y around the message line (slightly below the text baseline)
          const spreadY = Math.max(8, messageRect.height * 0.6);
          const cy = (messageRect.top - cardRect.top) + (messageRect.height/2) + (Math.random() * spreadY - spreadY/2);

          span.style.left = Math.round(cx) + 'px';
          span.style.top  = Math.round(cy) + 'px';

          // random delay and duration
          const delay = Math.random() * 0.6;
          const dur = 1.8 + Math.random()*1.2;
          span.style.animationDuration = dur + 's';
          span.style.animationDelay = delay + 's';
          span.style.fontSize = (14 + Math.random()*30) + 'px';

          decoration.appendChild(span);

          // remove after animation finishes
          setTimeout(() => {
            span.remove();
          }, (delay + dur) * 1000 + 300);
        }
      }

      // small enhancement: if user keeps trying to click in center where the no button started,
      // ensure the no button moves away occasionally
      document.addEventListener('mousemove', (e) => {
        const btnRect = noBtn.getBoundingClientRect();
        const dx = e.clientX - (btnRect.left + btnRect.width/2);
        const dy = e.clientY - (btnRect.top + btnRect.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 56) moveNoButton();
      });
    })();
  </script>
</body>
</html>
